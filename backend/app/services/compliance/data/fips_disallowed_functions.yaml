# Security functions FIPS 140-3 disallows (abridged), per category; the FIPS 140-3 and
# ISO/IEC 19790 reports fail any crypto asset of the category that uses one.
# Source: NIST SP 800-140C (Symmetric Key), SP 800-140D (Asymmetric Key),
# SP 800-140F (Hash Functions).
# This catalog enables algorithm-level conformance checks. Module-level
# CMVP certification is OUT OF SCOPE.

hash_functions:
  - MD5
  - MD-5
  - SHA-1
  - SHA1
symmetric_ciphers:
  - DES
  - DES-CBC
  - RC4
  - ARCFOUR
  - Blowfish          # not FIPS approved
  - 3DES              # TDEA encryption disallowed since 2024 (SP 800-131A Rev.2)
  - TripleDES
  - TDEA
  - DESede
asymmetric:
  - DSA               # disallowed in FIPS 140-3 IG since 2023
