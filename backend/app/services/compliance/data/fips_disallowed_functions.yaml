# Abridged from NIST SP 800-140C (symmetric key), SP 800-140D (asymmetric key) and SP 800-140F (hash functions).

hash_functions:
  - MD5
  - MD-5
  - SHA-1
  - SHA1
symmetric_ciphers:
  - DES
  - DES-CBC
  - RC4
  - ARCFOUR
  - Blowfish          # not FIPS approved
  - 3DES              # TDEA encryption disallowed since 2024 (SP 800-131A Rev.2)
  - TripleDES
  - TDEA
  - DESede
asymmetric:
  - DSA               # disallowed in FIPS 140-3 IG since 2023
