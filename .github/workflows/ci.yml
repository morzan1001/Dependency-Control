name: CI

# Master workflow: orchestrates backend, frontend, and SonarCloud as reusable
# child workflows. Each child file lives standalone (workflow_call only) so it
# can be reused or invoked manually, but the cross-workflow ordering — Sonar
# waits for both test jobs and downloads their coverage artifacts — is defined
# here in one place.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/ci-backend.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/ci-frontend.yml

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint and render with default and prod-like values
        working-directory: helm/dependency-control
        run: |
          helm lint .
          helm template . > /dev/null
          helm lint . -f ../ci/prod-like-values.yaml
          helm template . -f ../ci/prod-like-values.yaml > /dev/null

  sonarcloud:
    name: SonarCloud
    needs: [backend, frontend]
    # Dependabot-triggered runs get no repository secrets, so Sonar cannot authenticate.
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit
