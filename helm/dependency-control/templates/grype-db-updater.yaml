{{- if .Values.grypeDbUpdater.enabled }}
# Grype DB Updater: CronJob that downloads the Grype vulnerability database
# to a GCS bucket. Backend pods mount it read-only via GCSFuse.
# This saves ~1.4GB ephemeral storage per backend pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dependency-control.fullname" . }}-grype-db-updater
  labels:
    {{- include "dependency-control.labels" . | nindent 4 }}
    app.kubernetes.io/component: grype-db-updater
spec:
  schedule: "{{ .Values.grypeDbUpdater.schedule | default "0 */6 * * *" }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: grype-db-updater
          annotations:
            gke-gcsfuse/volumes: "true"
        spec:
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "dependency-control.fullname" . }}-grype-updater
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: grype-updater
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  echo "Updating Grype vulnerability database..."
                  export GRYPE_DB_CACHE_DIR=/tmp/grype-db
                  mkdir -p "$GRYPE_DB_CACHE_DIR"
                  grype db update
                  # Validate the fresh copy before touching the shared bucket: a broken
                  # update must never wipe or replace the live DB the backends read.
                  grype db status
                  echo "Publishing database to GCS bucket via GCSFuse mount..."
                  # No pre-delete: GCS object overwrites are atomic, so readers keep the
                  # live DB until each new object commits — this removes the multi-minute
                  # empty-bucket window that made backends fail "database does not exist".
                  for dir in "$GRYPE_DB_CACHE_DIR"/*/; do
                    ver="$(basename "$dir")"
                    mkdir -p "/grype-gcs/$ver"
                    # DB first, metadata last, to shrink the db/checksum mismatch window.
                    cp "$dir/vulnerability.db" "/grype-gcs/$ver/vulnerability.db"
                    for f in "$dir"*; do
                      [ "$(basename "$f")" = vulnerability.db ] || cp "$f" "/grype-gcs/$ver/"
                    done
                  done
                  # Prune stale schema dirs left by a grype DB schema bump.
                  for old in /grype-gcs/*/; do
                    [ -d "$GRYPE_DB_CACHE_DIR/$(basename "$old")" ] || rm -rf "$old"
                  done
                  echo "Grype DB publish completed successfully"
                  ls -lhR /grype-gcs/
              securityContext:
                runAsUser: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: grype-gcs
                  mountPath: /grype-gcs
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 4Gi
          volumes:
            - name: grype-gcs
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: {{ .Values.grypeDbUpdater.gcsBucket }}
            - name: tmp
              emptyDir:
                sizeLimit: 4Gi
{{- end }}
